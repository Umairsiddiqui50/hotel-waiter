<div class="top"><h1>Smart Table Service<small>Live demo: customer, waiter and manager are all connected through one system</small></h1>
<div class="seg" role="group" aria-label="View"><button id="vb1" data-act="view" data-id="demo" class="on">Live demo</button><button id="vb2" data-act="view" data-id="flow">Wireflow</button></div><label>Speed <select id="sp"><option value="1">1x (real: 45s)</option><option value="3" selected>3x (45s = 15s)</option><option value="10">10x (45s = 4.5s)</option></select></label>
<button data-act="reset">Reset</button></div>
<div id="vdemo"><div class="demo"><b>Run demo (auto):</b><button class="b" data-act="demo" data-k="n">1. Normal: Rahul accepts</button><button class="b" data-act="demo" data-k="r">2. Reject, then accept</button><button class="b" data-act="demo" data-k="i">3. Nobody accepts</button><button class="b" data-act="demo" data-k="o">4. No waiter online</button><button class="b" data-act="demo" data-k="f">5. Fair share (10 requests)</button><button class="b" data-act="demo" data-k="p">6. Primary waiter memory (Table 1)</button><button class="b" id="tabsb" data-act="tabs" style="display:none">Tabs view</button><button class="b" id="netb" data-act="net">Network: ON</button><span class="mut sm">Simulation: not a real backend.</span></div>

<section class="col" id="c2"><h2>Waiter phone (iPhone 13)</h2><div class="fit"><div class="iph"><div class="scrn"><div class="isl"></div><div class="sb"><span>9:41</span><span>5G &#9679;&#9679;&#9679;</span></div><div class="scr" id="wait"></div><div class="hb"></div></div></div></div></section>

</div><div id="vflow" class="fw" style="display:none"></div>
<script>
const TY=[["water","Water Bottle","W"],["salad","Salad / Chutney Refill","S"],["spt","Salt / Pepper / Tissue","T"],["bill","Ask for Bill","B"],["cutlery","Plate / Spoon / Bowl / Glass","P"],["call","Call Waiter","C"],["custom","Custom request","?"]];
const SUB={water:{m:1,o:["Cold","Normal","Hot"]},spt:{m:0,o:["Salt","Pepper","Tissue"]},bill:{m:1,o:["Cash","Online"]},cutlery:{m:0,o:["Plate","Spoon","Bowl","Glass"]}};
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TN=Object.fromEntries(TY.map(t=>[t[0],t[1].split(" (")[0]]));
const MENU=[["Veg Biryani",200,0],["Tandoori Roti",20],["Butter Naan",40],["Steam Rice",100],["Jeera Rice",130],["Cold Drink",40],["Sweet Lassi",70],["Dal Tadka",180],["Gulab Jamun",70]];
const OS=["PENDING","CONFIRMED","PREPARING","READY","SERVED"];
let W,R,A,O,P,L,S,D=true;
const LB=r=>TN[r.k]+(r.d?" ("+esc(r.d)+")":"");
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function init(){W=["Rahul","Aman","Vikas","Suresh","Mohit"].map((n,i)=>({id:i,n,on:i<3,push:true,miss:0,rej:0,acc:0,last:0}));
R=[];A=[];O=[];P={7:0};L=[];S={t:0,sp:+(document.getElementById("sp")||{value:3}).value,table:7,cv:"home",cart:{},sel:0,tab:"c1",toast:"",tt:0,rid:500,oid:0,aid:0,tabs:false,queue:null,qt:0,pb:0,open:null,pick:{},ctext:"",view:"demo",net:true,wl:false,rj:null,offc:null,wn:{},qrbad:false,wbad:false,tsel:null,ac:[],scan:false,say:"To start, press one of the demo buttons above, or tap Water on the Customer screen.",look:"c1",pre:"",plan:null};D=true}
const log=m=>{L.unshift(fmt(S.t)+"  "+m);L.length=Math.min(L.length,12)};
const say=(m,l)=>{S.say=m;if(l)S.look=l;D=true};
const toast=m=>{S.toast=m;S.tt=Date.now()+3500;D=true};
const fs=w=>w.acc+R.filter(r=>r.cur&&r.cur.w==w.id).length;
const load=w=>R.filter(r=>(r.status=="ACCEPTED"&&r.by==w.id)||(r.cur&&r.cur.w==w.id)).length;
const open=r=>!["CLOSED","CANCELLED"].includes(r.status);
function pick(r){const x=[...r.at.map(a=>a.w),...r.ex];const el=W.filter(w=>w.on&&!x.includes(w.id));if(!el.length)return null;
 const p=el.find(w=>w.id==P[r.table]);if(p&&!r.at.length)return p;return el.sort((a,b)=>fs(a)-fs(b)||load(a)-load(b)||a.last-b.last)[0]}
function assign(r,mw){const w=mw!=null?W[mw]:pick(r);if(!w)return fail(r,r.at.length?"ALL":"NONE");
 const secs=(mw==null&&!r.at.length)?45:30;w.last=S.t;if(S.rj==null)S.sel=w.id;
 r.status=r.at.length?"ESCALATED":"ASSIGNED";r.cur={w:w.id,dl:S.t+secs*1000};r.at.push({w:w.id,st:"WAITING",secs,t:S.t,dl:S.t+secs*1000});
 log(`#${r.id} T${r.table} ${LB(r)} &rarr; ${w.n} (${secs}s, attempt ${r.at.length})`);say(S.pre+`Request sent to ${w.n} (attempt ${r.at.length}/3). Must accept within ${secs} sec. `+(mw!=null?'Chosen by the manager.':secs==45?(w.id==P[r.table]?'First waiter: the primary waiter of this table, so 45 sec.':'First waiter: the one with the least work so far (fair share), so 45 sec.'):'Next online waiter with the least work so far, 30 sec.'),'c2');S.pre='';D=true}
function fail(r,type){r.status="FAILED";r.cur=null;r.last=S.t;r.rs=false;
 A.push({id:++S.aid,r:r.id,type,open:true,at:S.t});log(`#${r.id} FAILED &rarr; manager alert (${type=="NONE"?"no waiter online":r.at.length+" attempts fail"})`);say(S.pre+(type=="NONE"?"No waiter is online, so a HIGH PRIORITY alert went straight to the Manager. ":r.at.length+" waiters did not respond, so a HIGH PRIORITY alert went to the Manager. ")+"On the Manager screen you can assign a waiter or resolve the alert.","c3");S.pre="";D=true}
function next(r){if(r.at.length>=3)fail(r,"ALL");else assign(r)}
function end(r,st){const a=r.at[r.at.length-1];a.st=st;a.e=S.t;r.cur=null;D=true}
function tick(){const dt=250*S.sp;S.t+=dt;
 R.forEach(r=>{if(r.cur&&S.t>=r.cur.dl){const w=W[r.cur.w];w.miss++;log(`#${r.id} ${w.n} did not accept (MISSED)`);S.wn[w.id]={m:`Table ${r.table} (${LB(r)}): no response, the request moved to the next waiter.`,x:Date.now()+9000};S.pre=w.n+" did not respond within "+r.at[r.at.length-1].secs+" sec (MISSED), so the request moved to the next waiter automatically. ";end(r,"MISSED");next(r)}
  if(open(r)&&!r.rs&&S.t-r.last>=60000){r.rs=true;D=true}
  if(r.status=="ACCEPTED"){if(S.t-r.acc>=600000){r.status="CLOSED";log(`#${r.id} auto-closed 10 min after accept`);say("The request closed automatically 10 min after being accepted.","c3")}}});
 for(const k in S.wn)if(Date.now()>S.wn[k].x){delete S.wn[k];D=true}
 if(S.queue&&S.queue.length){const busy=R.some(r=>r.cur||["PENDING","ASSIGNED","ESCALATED"].includes(r.status));if(!busy){if(!S.qt)S.qt=Date.now()+2500;else if(Date.now()>=S.qt){S.qt=0;S.queue.shift()()}}}
 if(S.plan)R.forEach(r=>{if(r.cur){if(S.sel!=r.cur.w){S.sel=r.cur.w;D=true}const pl=S.plan,act=(Array.isArray(pl[0])?pl[r.id-S.pb-1]||[]:pl)[r.at.length-1];if(!r.cur.pl)r.cur.pl=Date.now()+1500;else if(act&&act!="ignore"&&Date.now()>=r.cur.pl){const w=r.cur.w;act=="accept"?accept(w,r.id):reject(w,r.id,"Busy")}}});
 document.querySelectorAll("[data-pb]").forEach(e=>{const p=e.dataset.pb.split("|");e.style.width=Math.min(100,100-(+p[0]-S.t)/(p[1]*10))+"%"});
 if(S.toast&&Date.now()>S.tt){S.toast="";D=true}
 document.querySelectorAll("[data-cd]").forEach(e=>e.textContent=fmt(+e.dataset.cd-S.t));
 document.querySelectorAll("[data-age]").forEach(e=>e.textContent=fmt(S.t-+e.dataset.age));
 if(D)render()}
function req(k,det){if(!S.net)return toast("No internet. Please try again when the connection is back.");const d=R.find(r=>r.table==S.table&&r.k==k&&["PENDING","ASSIGNED","ESCALATED"].includes(r.status));
